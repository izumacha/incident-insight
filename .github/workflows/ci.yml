name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # フロントエンド型チェック / TypeScript ビルド用に Node をセットアップ。
      # バージョンは Dockerfile の build ステージが使う Node と揃えること。
      # 揃っていないと、同じ CompileTypeScript ターゲットを別バージョンで動かすことになり、
      # 「CI は緑だがイメージのビルドでは失敗する(逆もある)」という食い違いが起きる。
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # tsc などの devDependencies をインストール (package-lock.json から再現性のあるインストール)
      - name: Install npm dependencies
        run: npm ci

      # --locked-mode でコミット済み packages.lock.json との一致を強制する
      # (ロックファイル更新漏れや意図しない依存差し替えを CI で検知する)
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # コンテナイメージのビルドと起動確認を行うジョブ。
  # build-and-test は SDK 上で直接ビルド/テストするだけなので、Dockerfile の
  # ベースイメージが壊れても検知できない。実際に issue となったのは次のケース:
  # アプリは net8.0 を対象にビルドされ、生成される runtimeconfig.json は
  # Microsoft.AspNetCore.App 8.0.0 を要求する。rollForward は既定の "Minor" で
  # メジャー跨ぎのロールフォワードをしないため、ランタイム段を aspnet:9.0 に
  # 上げると 8.0 ランタイムが無くなり、コンテナは起動時に落ちる。
  # それでも build-and-test は緑のままなので、この誤りが素通りしてしまう。
  # そこで「イメージを実際にビルドして起動し /health が 200 を返すこと」までを
  # CI で担保し、ベースイメージとアプリの TFM のズレを機械的に検出する。
  docker-image:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Dockerfile からイメージをビルドする。ここが失敗すればベースイメージや
      # publish 手順の破損をそのまま検知できる。
      - name: Build image
        run: docker build -t incident-insight:ci .

      # ビルドしたイメージをバックグラウンドで起動する。
      # - Audit__HashSalt: Production では未設定だと fail-closed で起動失敗する仕様のため、
      #   スモークテスト専用の使い捨て値を渡す(本番の秘密情報ではない)。
      # - DB は既定の SQLite なので追加のサービスコンテナは不要。
      #   コンテナ内の 8080 番をホストの 8080 番へ割り当てる。
      # TypeScript の生成物がイメージに入っているか検証する。
      # wwwroot/js/*.js は Git 管理外の tsc 生成物なので、SkipTsBuild=true が
      # 混入したり tsconfig の outDir/include が壊れたりすると、JS を含まない
      # イメージが出来上がる。/health は DB 接続しか見ないため 200 を返してしまい、
      # この退行を素通りさせる。そこで publish 出力を直接確認する。
      - name: Verify TypeScript output is present in image
        run: |
          docker run --rm --entrypoint sh incident-insight:ci -c \
            'ls -1 wwwroot/js/dashboard.js wwwroot/js/analytics.js wwwroot/js/site.js'

      - name: Start container
        id: start_container
        run: |
          docker run -d --name incident-insight-ci \
            -p 8080:8080 \
            -e Audit__HashSalt=ci-smoke-test-throwaway-salt \
            incident-insight:ci

      # /health は認証不要で DB 接続確認まで行うため、起動確認に使う。
      # 起動には数秒かかる(マイグレーション適用があるため)ので、最大 60 秒ポーリングする。
      # 200 を受け取った時点で成功として抜ける。
      # コンテナが落ちている場合は待ち続けても無駄なので即座に打ち切る。
      # ランタイム不一致で起動直後に終了するケース(このジョブが主に狙う退行)では、
      # 60 秒待って「応答なし」と報告するより「異常終了した」と報告する方が原因に直結する。
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' incident-insight-ci)" != "true" ]; then
              exit_code=$(docker inspect -f '{{.State.ExitCode}}' incident-insight-ci)
              echo "コンテナが起動待ちの途中で終了しました (exit code: ${exit_code})。" >&2
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ]; then
              echo "/health が 200 を返しました (${i} 秒目)。"
              exit 0
            fi
            sleep 1
          done
          echo "/health が 60 秒以内に 200 を返しませんでした (最後の応答: ${code})。" >&2
          exit 1

      # 失敗時のみコンテナログを出力する。起動失敗の原因(ランタイム不一致・
      # 設定不足など)は stdout に出るため、ログが無いと原因究明ができない。
      # コンテナ生成前(イメージビルド失敗など)には実行しない。無条件に走らせると
      # "No such container" で二重に赤くなり、本当の失敗理由が埋もれるため。
      - name: Dump container logs on failure
        if: failure() && steps.start_container.outcome == 'success'
        run: docker logs incident-insight-ci

      # 成否にかかわらずコンテナを後片付けする。
      - name: Clean up container
        if: always()
        run: docker rm -f incident-insight-ci || true
