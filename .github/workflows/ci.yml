name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # フロントエンド型チェック / TypeScript ビルド用に Node をセットアップ
      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # tsc などの devDependencies をインストール (package-lock.json から再現性のあるインストール)
      - name: Install npm dependencies
        run: npm ci

      # --locked-mode でコミット済み packages.lock.json との一致を強制する
      # (ロックファイル更新漏れや意図しない依存差し替えを CI で検知する)
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
