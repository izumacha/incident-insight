# Dependabot 設定: 依存関係の既知脆弱性・更新を毎週チェックして PR を作成する
# (CLAUDE.md §9「依存（サプライチェーン）を管理する」に基づく)
version: 2
updates:
  # IncidentInsight.sln 配下の NuGet 依存 (EF Core / ASP.NET Core パッケージ等)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(deps)"
    groups:
      # EF Core 系パッケージは「メジャー更新であっても」必ず 1 本の PR にまとめる。
      #
      # 【なぜ major も束ねるのか】このアプリは DB プロバイダ非依存 (SQLite / SQL Server /
      # PostgreSQL) で、プロバイダ実装は EF Core 本体 (Microsoft.EntityFrameworkCore.Relational)
      # と同じメジャー版でしか動作保証がない。既定のように major を個別 PR にすると、たとえば
      # Sqlite だけ 9.x へ上げた PR がマージされた時点で Relational も推移的に 9.x へ上がり、
      # 8.x のままの Npgsql.EntityFrameworkCore.PostgreSQL が EF Core 9 の内部 API に対して
      # 動くことになる。ビルドもテストも通る (テストは InMemory / SQLite しか触らない) ため
      # 「PostgreSQL 配備でだけ実行時に壊れる」という無言の破壊になる。
      # 1 本にまとめれば Npgsql を含む全プロバイダが同時に上がり、揃わない組み合わせは
      # そもそも PR として現れない。
      #
      # 版ズレそのものは EfCorePackageAlignmentTests が検出する (この設定を迂回した手動編集や、
      # Dependabot の設定変更で束ねが外れた場合の最後の砦)。
      #
      # 【なぜ 2 グループ必要か】applies-to の既定は version-updates で、セキュリティ更新
      # (脆弱性の報告を受けて Dependabot が別枠で出す PR) には及ばない。通常の版更新だけを
      # 束ねても、CVE 対応の更新はパッケージ単位の PR として現れ、その修正版がメジャーを
      # またぐと同じ版ズレが再発する。適用対象ごとにグループを分けて両方の経路を塞ぐ。
      # 対象パッケージは 3 箇所 (下の 2 グループと nuget-minor-and-patch の除外) で辻褄が
      # 合っている必要があり、EfCorePackageAlignmentTests が次の 2 つを固定する。
      #   - 下の 2 グループの patterns は集合として一致していること (許すのは並び順と
      #     大文字小文字の揺れだけで、同じ範囲を別の書き方で表しても一致とはみなさない)
      #   - nuget-minor-and-patch が EF Core 系を 1 つも拾わないこと。除外の書き方は問わないが、
      #     「今ロックファイルに在るパッケージ」だけでなく、上の patterns が表す範囲ごと
      #     覆えている必要がある。上のパターンが前方一致 ("Foo*") のときは、除外も
      #     その前置詞で始まるものをまるごと含む必要があり、ドット区切りの形を列挙する
      #     書き方 ("Foo" と "Foo.*") では "FooBar" のような同族が漏れるため足りない
      #     (完全一致のパターンは 1 つの ID しか指さないので、その ID を覆えていれば可)
      #     (例えば "Npgsql*" のように広く書くのは可。逆に
      #     "Microsoft.EntityFrameworkCore*" から末尾 '*' を落とすと、今あるプロバイダ実装
      #     (.Sqlite / .SqlServer / .Relational など)がその時点で漏れるため通らない)。
      #     ただし広げすぎると、下記の .NET リリース列パッケージまで minor / patch の
      #     束ねから外れてしまう。こちらも同テストが検出する
      #
      # 【束ねる範囲を「EF Core 本体＋プロバイダ実装」に限る理由】
      # 名前に EntityFrameworkCore を含んでいても、版の動き方が違うものがある。
      #   - プロバイダ実装 (Sqlite / SqlServer / Npgsql) は EF Core の内部 API に結び付くため、
      #     EF Core 本体とメジャー版が一致していなければならない ＝ 束ねる対象。
      #   - Microsoft.AspNetCore.Identity.EntityFrameworkCore と
      #     Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore は EF Core の
      #     公開 API しか使わず、メジャー版は .NET のリリース (net8.0 → net9.0) に追随する。
      #     実際 9.0.0 は net9.0 のみを対象とし、net8.0 のこのアプリでは復元できない。
      #     これらを同じ束ねに入れると「EF Core 9 へ上げる PR」が net9.0 専用パッケージを
      #     巻き込んで復元不能になり、支援されているはずの更新経路が塞がれる。
      nuget-ef-core:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"                                  # EF Core 本体と各プロバイダ
          - "Npgsql.EntityFrameworkCore.PostgreSQL"                           # PostgreSQL プロバイダ (メジャー版が EF Core に追随する)
      # セキュリティ更新も同じ顔ぶれで 1 本にまとめる (上のコメントの理由による)
      nuget-ef-core-security:
        applies-to: security-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)。
      # EF Core 系は上のグループが全 update-type を引き受けるため、ここでは対象外にする
      # (どちらのグループに入るかを定義順に依存させず、除外で明示する)
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"

  # package.json の npm 依存 (TypeScript ビルドツール)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(deps)"
    groups:
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ (.NET SDK / ASP.NET ランタイム)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(docker)"

  # .github/workflows/ で使う GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(ci)"
